services:
  postgres:
    image: postgres:16-alpine
    container_name: microservices-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: microservices
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  python-service:
    build:
      context: ./python
      dockerfile: Dockerfile
    container_name: microservices-python
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/microservices
      APP_NAME: python-microservice
      PORT: 8000
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  go-service:
    build:
      context: ./go
      dockerfile: Dockerfile
    container_name: microservices-go
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/microservices
      APP_NAME: go-microservice
      PORT: 8080
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  rust-service:
    build:
      context: ./rust
      dockerfile: Dockerfile
    container_name: microservices-rust
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/microservices
      APP_NAME: rust-microservice
      PORT: 8081
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8081/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  postgres_data:
